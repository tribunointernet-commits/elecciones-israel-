<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elecciones parlamentarias en Israel 2026</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif;color:#17202a}
.election{width:100%;border:1px solid #e2e6eb;background:#fff;padding:12px 14px 10px}
.header{background:linear-gradient(90deg,#0038b8 0,#0038b8 44%,#fff 44%,#fff 56%,#0038b8 56%,#0038b8 100%);border-radius:10px;padding:11px 15px;margin-bottom:12px;position:relative;overflow:hidden}
.header:after{content:"";position:absolute;inset:0;background:rgba(0,56,184,.82)}
.header h2{position:relative;z-index:1;margin:0;color:#fff;font-size:clamp(17px,1.8vw,23px);line-height:1.2}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.metric{background:#f4f7fb;border-radius:9px;padding:8px 10px;text-align:center}
.metric span{display:block;font-size:10px;color:#718096;text-transform:uppercase;letter-spacing:.04em}
.metric b{display:block;font-size:15px;margin-top:2px;color:#17202a}
.carousel{display:flex;align-items:center;gap:8px}
.arrow{width:30px;min-width:30px;height:32px;border:1px solid #dce3eb;border-radius:50%;background:#fff;color:#315988;font-size:23px;line-height:1;display:grid;place-items:center;cursor:pointer}
.arrow:disabled{opacity:.28;cursor:default}
.viewport{min-width:0;flex:1;overflow:hidden}
.track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;padding:2px 0 4px}
.track::-webkit-scrollbar{display:none}
.card{scroll-snap-align:start;flex:0 0 calc((100% - 24px)/3);min-width:0;background:#f7f9fc;border:1px solid #edf0f4;border-radius:13px;padding:12px;min-height:132px;display:flex;flex-direction:column}
.rank{font-size:11px;font-weight:700;color:#0038b8;min-height:14px}
.head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-top:3px}
.name{font-size:15px;font-weight:700;line-height:1.18;overflow-wrap:anywhere}
.letters{font-size:14px;font-weight:700;color:#5d6a79;direction:rtl;white-space:nowrap;background:#fff;border:1px solid #e2e6eb;border-radius:6px;padding:3px 7px}
.pct{font-size:28px;font-weight:700;letter-spacing:-.04em;margin-top:auto;padding-top:12px}
.bar{height:10px;background:#fff;border:1px solid #d8dee7;border-radius:999px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:#0038b8;transition:width .35s}
.footerline{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:11px;color:#697687}
.seats{font-weight:700;color:#0038b8}
.updated{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-size:11px;color:#7a8794}
.updated:before,.updated:after{content:"";height:1px;background:#e1e6eb;flex:1}
.status{font-size:11px;color:#697684;text-align:center;margin-top:6px}
.source{font-size:10px;color:#74808c;text-align:right;margin-top:5px}
@media(max-width:860px){.card{flex-basis:calc((100% - 12px)/2)}}
@media(max-width:560px){
 .election{padding:10px 8px}
 .card{flex-basis:100%}
 .meta{grid-template-columns:1fr 1fr}
 .metric:last-child{grid-column:1/-1}
 .arrow{width:26px;min-width:26px;height:28px}
}
</style>
</head>
<body>
<section class="election">
  <div class="header"><h2>ELECCIONES PARLAMENTARIAS · ISRAEL 2026</h2></div>
  <div class="meta">
    <div class="metric"><span>Localidades con datos</span><b id="counted">—</b></div>
    <div class="metric"><span>Votos contabilizados</span><b id="votesTotal">—</b></div>
    <div class="metric"><span>Listas con votos</span><b id="listsCount">—</b></div>
  </div>
  <div class="carousel">
    <button class="arrow" id="prev" aria-label="Anterior">&#8249;</button>
    <div class="viewport"><div class="track" id="track"></div></div>
    <button class="arrow" id="next" aria-label="Siguiente">&#8250;</button>
  </div>
  <div class="updated"><span id="updated">A la espera de resultados oficiales</span></div>
  <div class="status" id="status">Estructura lista para conectar con la Comisión Central Electoral de Israel.</div>
  <div class="source">Fuente: Comisión Central Electoral de Israel</div>
</section>
<script>
const PARTY_MAP = [{"letters": "בקר", "name": "Luz del Amanecer"}, {"letters": "פה", "name": "Ani VeAta - Partido del Pueblo de Israel"}, {"letters": "ז", "name": "Betach - Seguridad Social"}, {"letters": "נץ", "name": "Seguridad Personal"}, {"letters": "רק", "name": "Beyahad"}, {"letters": "בד", "name": "Juntos Triunfaremos - Lista conjunta árabe-judía"}, {"letters": "זץ", "name": "Brit Olam para la Redención de Israel"}, {"letters": "יק", "name": "Bloque Bíblico"}, {"letters": "ה", "name": "Jardín del Edén"}, {"letters": "אמת", "name": "Los Demócratas"}, {"letters": "מחל", "name": "Likud"}, {"letters": "די", "name": "Los Reservistas y el Partido Económico"}, {"letters": "צף", "name": "Partido Pirata de Israel"}, {"letters": "זך", "name": "Público Jaredí"}, {"letters": "ט", "name": "Sionismo Religioso"}, {"letters": "רץ", "name": "HaKahal"}, {"letters": "ודם", "name": "Lista Conjunta"}, {"letters": "ד", "name": "La Asociación para Todos"}, {"letters": "שס", "name": "Shas"}, {"letters": "נקי", "name": "Reforma del sistema electoral y de gobierno"}, {"letters": "ג", "name": "Judaísmo Unido de la Torá"}, {"letters": "דרך", "name": "Yashar"}, {"letters": "ל", "name": "Yisrael Beiteinu"}, {"letters": "י", "name": "Israel Primero"}, {"letters": "כן", "name": "Azul y Blanco"}, {"letters": "ק", "name": "Tkuma"}, {"letters": "קץ", "name": "Ley Justa"}, {"letters": "ני", "name": "Noam"}, {"letters": "קך", "name": "Nuevo Orden"}, {"letters": "ב", "name": "Otzma Yehudit"}, {"letters": "ך", "name": "Amcha Yisrael"}, {"letters": "נר", "name": "Color Negro - Guardianes del Mundo de la Torá"}, {"letters": "בי", "name": "Tzomet - Beit Yisrael"}, {"letters": "קה", "name": "Voz de las Mujeres"}, {"letters": "עם", "name": "Ra'am"}, {"letters": "נף", "name": "Shema"}, {"letters": "צדק", "name": "Sharshar por el Amor y la Unidad del Pueblo"}, {"letters": "צבי", "name": "Movimiento Ahi"}];
const track=document.getElementById('track');
const $=id=>document.getElementById(id);
let rows=[];

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>Number(n||0).toLocaleString('es-AR');

function draw(list,live=false){
  rows=[...list].sort((a,b)=>(b.votes??-1)-(a.votes??-1)||a.name.localeCompare(b.name,'es'));
  track.innerHTML=rows.map((p,i)=>{
    const pct=live && Number.isFinite(p.percent) ? p.percent.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%' : '—';
    const width=live && Number.isFinite(p.percent) ? Math.max(0,Math.min(100,p.percent)) : 0;
    return `<article class="card">
      <div class="rank">${live?(i+1)+'º':''}</div>
      <div class="head">
        <div class="name">${esc(p.name)}</div>
        <div class="letters" title="Letras de la papeleta">${esc(p.letters)}</div>
      </div>
      <div class="pct">${pct}</div>
      <div class="bar"><i style="width:${width}%"></i></div>
      <div class="footerline">
        <span>${live?num(p.votes)+' votos':'Votos pendientes'}</span>
        <span class="seats">${live && p.seats!=null ? p.seats+' bancas' : ''}</span>
      </div>
    </article>`;
  }).join('');
  track.scrollLeft=0;
  requestAnimationFrame(buttons);
}

function step(){
  const c=track.querySelector('.card');
  return c ? c.getBoundingClientRect().width+12 : 1;
}
function visible(){return Math.max(1,Math.round((track.clientWidth+12)/step()))}
function current(){return Math.round(track.scrollLeft/step())}
function move(i){track.scrollTo({left:Math.max(0,Math.min(rows.length-1,i))*step(),behavior:'smooth'})}
function buttons(){
  const i=current(), v=visible();
  $('prev').disabled=i<=0;
  $('next').disabled=i>=Math.max(0,rows.length-v);
}
$('prev').onclick=()=>move(current()-visible());
$('next').onclick=()=>move(current()+visible());
track.addEventListener('scroll',buttons);
window.addEventListener('resize',buttons);

// Vista previa del catálogo de listas. Al conectar el feed oficial,
// solo se dibujarán las listas que realmente vengan en los resultados.
draw(PARTY_MAP.map(p=>({...p,votes:null,percent:null,seats:null})),false);


const CEC_CSV_URL='https://media26.bechirot.gov.il/files/expc.csv';

function parseCSV(text){
  const rows=[];
  let row=[], field='', quoted=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(quoted){
      if(ch === '"'){
        if(text[i+1] === '"'){ field+='"'; i++; }
        else quoted=false;
      } else field+=ch;
    } else {
      if(ch === '"') quoted=true;
      else if(ch === ','){ row.push(field); field=''; }
      else if(ch === '\n'){
        row.push(field); field='';
        if(row.some(v=>String(v).trim()!=='')) rows.push(row);
        row=[];
      } else if(ch !== '\r') field+=ch;
    }
  }
  if(field.length || row.length){
    row.push(field);
    if(row.some(v=>String(v).trim()!=='')) rows.push(row);
  }
  return rows;
}

function cleanHeader(v){
  return String(v??'').replace(/^\uFEFF/,'').trim();
}
function toNumber(v){
  const n=Number(String(v??'').replace(/[^\d.-]/g,''));
  return Number.isFinite(n)?n:0;
}
function findHeaderIndex(headers, candidates){
  for(const c of candidates){
    const i=headers.indexOf(c);
    if(i>=0) return i;
  }
  return -1;
}

function parseOfficialCEC(csvText){
  const matrix=parseCSV(csvText);
  if(matrix.length<2) throw Error('CSV oficial vacío o incompleto');

  const headers=matrix[0].map(cleanHeader);
  const body=matrix.slice(1);

  // Campos administrativos habituales del archivo oficial.
  const validIdx=findHeaderIndex(headers,['כשרים','קולות כשרים']);
  const votersIdx=findHeaderIndex(headers,['מצביעים','מספר מצביעים']);
  const invalidIdx=findHeaderIndex(headers,['פסולים','קולות פסולים']);

  const partyColumns=PARTY_MAP
    .map(p=>({...p,col:headers.indexOf(p.letters)}))
    .filter(p=>p.col>=0);

  if(!partyColumns.length){
    throw Error('No se encontraron columnas de listas reconocidas en el CSV');
  }

  const sums=new Map(partyColumns.map(p=>[p.letters,0]));
  let validVotes=0, totalVoters=0, invalidVotes=0, localities=0;

  for(const row of body){
    if(!row || !row.length) continue;
    let hasVotes=false;

    if(validIdx>=0){
      const n=toNumber(row[validIdx]);
      validVotes+=n;
      if(n>0) hasVotes=true;
    }
    if(votersIdx>=0) totalVoters+=toNumber(row[votersIdx]);
    if(invalidIdx>=0) invalidVotes+=toNumber(row[invalidIdx]);

    for(const p of partyColumns){
      const v=toNumber(row[p.col]);
      sums.set(p.letters,(sums.get(p.letters)||0)+v);
      if(v>0) hasVotes=true;
    }
    if(hasVotes) localities++;
  }

  // Si el campo de votos válidos no viniera en esta versión,
  // lo reconstruimos sumando todas las columnas partidarias conocidas.
  if(validVotes<=0){
    validVotes=[...sums.values()].reduce((a,b)=>a+b,0);
  }

  const results=partyColumns.map(p=>{
    const votes=sums.get(p.letters)||0;
    return {
      letters:p.letters,
      name:p.name,
      votes,
      percent:validVotes>0 ? (votes/validVotes)*100 : 0,
      seats:null
    };
  }).filter(p=>p.votes>0);

  results.sort((a,b)=>b.votes-a.votes || a.name.localeCompare(b.name,'es'));

  return {results,validVotes,totalVoters,invalidVotes,localities};
}

async function refreshOfficial(){
  try{
    const r=await fetch(CEC_CSV_URL,{cache:'no-store'});
    if(!r.ok) throw Error('HTTP '+r.status);
    const text=await r.text();
    const parsed=parseOfficialCEC(text);

    if(!parsed.results.length) throw Error('Todavía no hay votos oficiales cargados');

    draw(parsed.results,true);
    $('listsCount').textContent=parsed.results.length.toLocaleString('es-AR');
    $('votesTotal').textContent=num(parsed.validVotes);
    $('counted').textContent=parsed.localities.toLocaleString('es-AR')+' localidades';
    $('updated').textContent='Última actualización: '+new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
    $('status').textContent='Resultados oficiales de la Comisión Central Electoral. Actualización automática cada 60 segundos.';
  }catch(err){
    console.error(err);
    $('status').textContent='Esperando actualización del archivo oficial de la Comisión Electoral.';
  }
}

refreshOfficial();
setInterval(refreshOfficial,60000);

</script>
</body>
</html>
